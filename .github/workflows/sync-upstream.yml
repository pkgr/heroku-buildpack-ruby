name: Sync Upstream

on:
  schedule:
    # 00:00 UTC, which is 02:00 in Paris during DST and 01:00 otherwise.
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-upstream:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Sync latest upstream tag
        env:
          DEFAULT_RUBY_BUMP_COMMIT: fc500664466eef57a3b457c2a5c7edbb9082013c
          MINIMUM_DEFAULT_RUBY_VERSION: 3.3.11
          UPSTREAM_URL: https://github.com/heroku/heroku-buildpack-ruby.git
        run: ./.github/scripts/sync-upstream.sh
